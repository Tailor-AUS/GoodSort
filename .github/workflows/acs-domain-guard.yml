name: ACS domain guard

# Safety net for OTP email. thegoodsort.org must stay linked to goodsort-comm
# or every signup fails with DomainNotLinked while the domain still reads as
# fully verified — a failure that looks like a code bug and is not.
#
# This used to run every 30 minutes because we sent through tailor-app's shared
# tailor-prod-comm, whose linkedDomains array their Bicep declares and ARM
# therefore rewrites on every infra deploy. That took signups down three times
# on 2026-08-31. We now own goodsort-comm, so no other team's deploy can reach
# it and there is nothing left to race.
#
# Cadence is deliberately 6-hourly, not 30-minutely. The send probe below is a
# real email to an address with no mailbox, so it hard-bounces off our own
# Exchange Online MX. At 48/day against a sending domain with almost no
# legitimate volume that is a bounce ratio ACS can throttle us for; at 4/day it
# is noise. Detection latency is an acceptable trade now that the recurring
# clobberer is gone.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ensure-linked:
    runs-on: ubuntu-latest
    name: Ensure ACS sender domain is linked
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check and repair
        uses: azure/cli@v2
        with:
          # Shared with deploy-api.yml on purpose: this logic was duplicated in
          # both workflows, and so was the bug that made it crash on exactly
          # the state it was written to repair.
          inlineScript: bash scripts/ensure-acs-domain-linked.sh

      - name: Confirm a code can actually be sent
        run: |
          # Linkage is necessary, not sufficient - the only proof that matters
          # is the API accepting a send. 400 here means still broken.
          CODE=$(curl -sS -m 25 -o /dev/null -w "%{http_code}" -X POST \
            https://api.livelyfield-64227152.eastasia.azurecontainerapps.io/api/auth/send-otp \
            -H 'content-type: application/json' \
            -d '{"email":"acs-guard@thegoodsort.org"}')
          echo "send-otp returned $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error title=Signups are down::send-otp returned $CODE after the linkage check. Email is still broken."
            exit 1
          fi
