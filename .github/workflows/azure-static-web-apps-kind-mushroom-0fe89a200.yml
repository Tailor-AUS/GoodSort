name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, same as CI. The IndexNow submit imports a .ts suburb list via
          # --experimental-strip-types, which needs 22.6+.
          node-version: "22"
          cache: npm

      - name: Install and Build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.livelyfield-64227152.eastasia.azurecontainerapps.io

      - name: Deploy to Azure SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUSHROOM_0FE89A200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "out"
          output_location: ""

      # Production only. A pull request uploads a preview host, and IndexNow
      # checks the key on thegoodsort.org — pinging it from a preview would
      # 403 until this commit is the live site, and would not index the preview.
      - name: Submit public URLs to IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node --experimental-strip-types scripts/submit-indexnow.mjs

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUSHROOM_0FE89A200 }}
          action: "close"
