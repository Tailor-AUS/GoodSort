name: Prune SWA preview environments

# Azure Static Web Apps caps staging environments (3 on this plan). When the
# cap is hit, EVERY subsequent PR's preview deploy fails with
# "already has the maximum number of staging environments" - and it fails
# quietly, because `gh pr checks` surfaces the newest run per workflow, which
# for a merged PR is the close job. PRs #24 and #25 both had a failed preview
# deploy that looked green from the PR page.
#
# The close_pull_request_job in the SWA workflow is supposed to delete the
# environment on close, but environments for #20, #21 and #22 survived their
# merges. Rather than debug that action's edge cases, reconcile the desired
# state on a schedule: an environment should exist only while its PR is open.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete environments whose PR is no longer open
        env:
          GH_TOKEN: ${{ github.token }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            SWA="swa-goodsort-prod"
            RG="rg-goodsort-prod"

            # 'default' is production. Never touch it.
            ENVS=$(az staticwebapp environment list --name "$SWA" -g "$RG" \
                     --query "[?name!='default'].name" -o tsv)

            if [ -z "$ENVS" ]; then
              echo "No preview environments. Nothing to prune."
              exit 0
            fi

            for e in $ENVS; do
              # SWA names a PR preview after the PR number.
              case "$e" in
                ''|*[!0-9]*) echo "Skipping '$e' - not a PR number, not ours to reap."; continue ;;
              esac

              STATE=$(gh pr view "$e" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo "MISSING")
              if [ "$STATE" = "OPEN" ]; then
                echo "PR #$e is open - keeping its preview."
                continue
              fi

              echo "PR #$e is $STATE - deleting preview environment."
              az staticwebapp environment delete --name "$SWA" -g "$RG" \
                --environment-name "$e" --yes -o none \
                || echo "::warning title=Prune failed::Could not delete environment $e."
            done
