name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      # The image is built from the repo-root Dockerfile, so a change to it must
      # trigger a deploy. Without this, a base-image bump or a runtime CVE patch
      # merges green and never ships.
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'
      - 'scripts/ensure-openai-provisioned.sh'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy .NET API

    # The money-path concurrency tests need a real SQL Server: the InMemory
    # provider cannot translate ExecuteUpdate, so it runs a non-atomic fallback
    # and a read-compare-write implementation passes exactly the same tests as
    # the atomic one.
    #
    # This service is duplicated from ci.yml on purpose. ci.yml runs in a
    # separate workflow with no `needs:` and no `workflow_run:`, and both
    # workflows trigger on the same push to main — so they race, and a red CI
    # cannot stop or roll back a deploy that is already running. Until a deploy
    # actually depends on CI, the only way for the shipping path to be gated is
    # for the gate to live on the shipping path.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway credential for an ephemeral container that exists only for
          # the length of this job and is never reachable from outside it.
          MSSQL_SA_PASSWORD: "GoodSortCI!2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GoodSortCI!2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test density invariants
        run: dotnet test src/GoodSort.Api.Tests/GoodSort.Api.Tests.csproj -c Release --nologo
        env:
          GOODSORT_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=GoodSortCI!2026;TrustServerCertificate=True;"

      # Without this, the step above passes while the twelve tests that check
      # for double-spends silently skip. That is not hypothetical: run
      # 33360405276 deliberately restored the pre-fix cash-out race, and the
      # ONLY tests that failed were these. On this workflow, which had no SQL
      # service, that commit would have gone green and shipped the double-spend.
      - name: Concurrency tests must have actually run before we ship
        run: |
          set +e
          dotnet test src/GoodSort.Api.Tests/GoodSort.Api.Tests.csproj -c Release --nologo             --filter "FullyQualifiedName~SqlConcurrencyTests"             --logger "console;verbosity=normal" > sql-tests.txt 2>&1
          code=$?
          set -e
          cat sql-tests.txt

          if grep -q "Skipped GoodSort.Api.Tests.SqlConcurrencyTests" sql-tests.txt; then
            echo "::error title=Concurrency tests skipped::SqlConcurrencyTests did not run, so nothing verified the money-path races. Refusing to deploy."
            exit 1
          fi

          if ! grep -qE "Total tests: [1-9]" sql-tests.txt; then
            echo "::error title=Concurrency tests did not execute::No tests were discovered, so nothing verified the money-path races. Refusing to deploy."
            exit 1
          fi

          exit $code
        env:
          GOODSORT_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=GoodSortCI!2026;TrustServerCertificate=True;"

      - name: Build
        run: dotnet publish src/GoodSort.Api/GoodSort.Api.csproj -c Release -o publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # container-apps-deploy-action@v2 is broken by an Azure CLI bug in
      # azext_containerapp ("'NoneType' object has no attribute 'linux'").
      # Build in ACR, run a gated EF migration job inside the Container Apps
      # environment BEFORE updating live web replicas (AGENTS.md §2 D4), and
      # only promote the web app once migrations exit 0.
      - name: Build image, run gated EF migrations, and deploy to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            IMAGE="acrnyjfw2pdfsrie.azurecr.io/api:${{ github.sha }}"
            RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
            APP="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
            JOB="goodsort-db-migrate"

            az acr build --registry acrnyjfw2pdfsrie \
              --image "api:${{ github.sha }}" \
              --build-arg GIT_SHA="${{ github.sha }}" \
              --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --file Dockerfile .

            ENV_ID=$(az containerapp show -n "$APP" -g "$RG" --query properties.environmentId -o tsv)
            SECRET_REF=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[?name=='ConnectionStrings__goodsortdb'].secretRef | [0]" -o tsv 2>/dev/null || true)
            SQL_CS=""
            if [ -n "$SECRET_REF" ] && [ "$SECRET_REF" != "None" ]; then
              SQL_CS=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name "$SECRET_REF" --query value -o tsv 2>/dev/null || true)
            fi
            if [ -z "$SQL_CS" ]; then
              SQL_CS=$(az containerapp secret show -n "$APP" -g "$RG" --secret-name connectionstrings--goodsortdb --query value -o tsv 2>/dev/null || true)
            fi
            if [ -z "$SQL_CS" ]; then
              SQL_CS=$(az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env[?name=='ConnectionStrings__goodsortdb'].value | [0]" -o tsv)
            fi
            if [ -z "$SQL_CS" ] || [ "$SQL_CS" = "None" ]; then
              echo "::error title=Missing SQL connection string::Could not resolve ConnectionStrings__goodsortdb for gated EF migration. Refusing to deploy."
              exit 1
            fi

            ACR_IDENTITY=$(az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.registries[0].identity" -o tsv)
            if [ -z "$ACR_IDENTITY" ] || [ "$ACR_IDENTITY" = "None" ]; then
              echo "::error title=Missing ACR Managed Identity::Could not resolve ACR pull identity from $APP. Refusing to deploy."
              exit 1
            fi

            if az containerapp job show -n "$JOB" -g "$RG" >/dev/null 2>&1; then
              az containerapp job identity assign -n "$JOB" -g "$RG" --user-assigned "$ACR_IDENTITY" >/dev/null
              az containerapp job registry set -n "$JOB" -g "$RG" \
                --server acrnyjfw2pdfsrie.azurecr.io \
                --identity "$ACR_IDENTITY" >/dev/null
              az containerapp job secret set -n "$JOB" -g "$RG" \
                --secrets "sql-cs=$SQL_CS" >/dev/null
              az containerapp job update -n "$JOB" -g "$RG" \
                --image "$IMAGE" \
                --set-env-vars "ConnectionStrings__goodsortdb=secretref:sql-cs" "ASPNETCORE_ENVIRONMENT=Production" "GOODSORT_MIGRATE_ONLY=true" >/dev/null
            else
              az containerapp job create -n "$JOB" -g "$RG" \
                --environment "$ENV_ID" \
                --trigger-type Manual \
                --replica-timeout 300 \
                --replica-retry-limit 0 \
                --replica-completion-count 1 \
                --parallelism 1 \
                --image "$IMAGE" \
                --mi-user-assigned "$ACR_IDENTITY" \
                --registry-server acrnyjfw2pdfsrie.azurecr.io \
                --registry-identity "$ACR_IDENTITY" \
                --cpu 0.5 --memory 1.0Gi \
                --secrets "sql-cs=$SQL_CS" \
                --env-vars "ConnectionStrings__goodsortdb=secretref:sql-cs" "ASPNETCORE_ENVIRONMENT=Production" "GOODSORT_MIGRATE_ONLY=true" >/dev/null
            fi

            EXEC_NAME=$(az containerapp job start -n "$JOB" -g "$RG" --query name -o tsv)
            echo "Started gated EF migration execution: $EXEC_NAME"
            STATUS="Running"
            for _ in $(seq 1 60); do
              sleep 5
              STATUS=$(az containerapp job execution show -n "$JOB" -g "$RG" --job-execution-name "$EXEC_NAME" --query properties.status -o tsv)
              if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
                break
              fi
            done
            if [ "$STATUS" != "Succeeded" ]; then
              echo "::error title=EF migration failed::Migration job $EXEC_NAME finished with status '$STATUS'. Refusing to update live Container App."
              exit 1
            fi

            az containerapp update \
              -n "$APP" \
              -g "$RG" \
              --image "$IMAGE"

      - name: Ensure standalone Azure OpenAI is provisioned and wired
        uses: azure/cli@v2
        with:
          inlineScript: |
            bash scripts/ensure-openai-provisioned.sh "${{ secrets.AZURE_RESOURCE_GROUP }}" "${{ secrets.AZURE_CONTAINER_APP_NAME }}" oai-goodsort-prod australiaeast

      # thegoodsort.org must stay linked to goodsort-comm or every OTP fails
      # with DomainNotLinked. Cheap to check on the way past.
      #
      # Non-blocking by design: failing a deploy on a broken sender link also
      # blocks shipping the fix for a broken sender link. That is not
      # hypothetical - it is what run 33352157022 did, to a deploy whose
      # container had already gone out successfully.
      #
      # Escalation, verified against Azure on 2026-09-02 rather than assumed:
      #   detection - scheduled-query alert gs-otp-email-down in rg-GoodSort,
      #               severity 1, evaluated every 15 minutes, wired to action
      #               group goodsort-email (enabled, email receiver enabled);
      #   repair    - acs-domain-guard.yml, cron "0 */6 * * *", so up to six
      #               hours. Deliberately not 30-minutely: its send probe hard
      #               bounces off our own MX, and 48/day on a low-volume
      #               sending domain is a ratio ACS can throttle us for.
      #   now       - gh workflow run acs-domain-guard.yml
      #
      # AcsEscalationAccuracyTests keeps the number below in step with the
      # cron, because this message used to promise 30 minutes.
      - name: Ensure ACS sender domain is linked
        uses: azure/cli@v2
        with:
          inlineScript: |
            bash scripts/ensure-acs-domain-linked.sh || echo "::warning title=ACS link not repaired::Deploy continued anyway. Alert gs-otp-email-down detects a broken sender within 15 minutes; the scheduled guard retries within 6 hours. To repair now: gh workflow run acs-domain-guard.yml"
