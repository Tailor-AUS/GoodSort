name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy .NET API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test density invariants
        run: dotnet test src/GoodSort.Api.Tests/GoodSort.Api.Tests.csproj -c Release --nologo

      - name: Build
        run: dotnet publish src/GoodSort.Api/GoodSort.Api.csproj -c Release -o publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # container-apps-deploy-action@v2 is broken by an Azure CLI bug in
      # azext_containerapp ("'NoneType' object has no attribute 'linux'").
      # Build in ACR and point the app at the new image instead.
      - name: Deploy to Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build --registry acrnyjfw2pdfsrie \
              --image api:${{ github.sha }} \
              --file Dockerfile .
            az containerapp update \
              -n ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image acrnyjfw2pdfsrie.azurecr.io/api:${{ github.sha }}

      # thegoodsort.org keeps getting dropped from the shared Communication
      # Service's linkedDomains array, which takes every signup down with it.
      # Root cause is tailor-app's Bicep declaring that array; until it includes
      # our domain, we re-link on the way past.
      #
      # Non-blocking by design. The Communication Service lives in
      # rg-tailor-app-prod, not rg-GoodSort, so this identity may not be able to
      # read or patch it at all - and more importantly, failing the deploy on a
      # broken sender link also blocks shipping the fix for it. That is not a
      # hypothetical: it is what run 33352157022 did. Escalation is the
      # scheduled ACS domain guard plus alert gs-otp-email-down.
      - name: Ensure ACS sender domain is linked
        uses: azure/cli@v2
        with:
          inlineScript: |
            bash scripts/ensure-acs-domain-linked.sh || echo "::warning title=ACS link not repaired::Deploy continued anyway; the scheduled ACS domain guard retries within 30 minutes."
