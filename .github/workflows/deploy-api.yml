name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy .NET API
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build the image directly in ACR. This replaces the previous
      # azure/container-apps-deploy-action@v2, which fails on a known azext_containerapp
      # bug ("'NoneType' object has no attribute 'linux'"). The Dockerfile is a
      # self-contained multi-stage build, so no host-side dotnet publish is needed.
      #
      # Requires repo secret AZURE_ACR_NAME = the Container Registry name (no
      # ".azurecr.io" suffix), alongside the existing AZURE_* secrets.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.AZURE_ACR_NAME }}" \
            --image "api:${{ github.sha }}" \
            --image "api:latest" \
            --file Dockerfile .

      - name: Deploy image to Container Apps
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.AZURE_ACR_NAME }}.azurecr.io/api:${{ github.sha }}"
